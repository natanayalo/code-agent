x-bounded-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  postgres:
    logging: *bounded-logging
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB?Please set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER?Please set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?Please set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER?Please set POSTGRES_USER in .env} -d ${POSTGRES_DB?Please set POSTGRES_DB in .env}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
  temporal:
    logging: *bounded-logging
    image: temporalio/auto-setup:1.24.2
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER?Please set POSTGRES_USER in .env}
      - POSTGRES_PWD=${POSTGRES_PASSWORD?Please set POSTGRES_PASSWORD in .env}
      - POSTGRES_SEEDS=postgres
    ports:
      - "127.0.0.1:7233:7233"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "tctl --address \"$(hostname -i):7233\" cluster health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
  temporal-ui:
    logging: *bounded-logging
    image: temporalio/ui:2.24.0
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    depends_on:
      - temporal
  migrate:
    logging: *bounded-logging
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      CODE_AGENT_RUN_API: 0
      CODE_AGENT_RUN_WORKER: 0
      CODE_AGENT_ENABLE_TASK_SERVICE: 1
      CODE_AGENT_API_SHARED_SECRET: ${CODE_AGENT_API_SHARED_SECRET?Please set CODE_AGENT_API_SHARED_SECRET in .env}
      DATABASE_HOST: ${DATABASE_HOST:-postgres}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB?Please set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER?Please set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?Please set POSTGRES_PASSWORD in .env}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${DATABASE_HOST:-postgres}:${DATABASE_PORT:-5432}/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
  api:
    logging: *bounded-logging
    networks: [default, telegram-upstream]
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      CODE_AGENT_RUN_API: 1
      CODE_AGENT_RUN_WORKER: 0
      CODE_AGENT_ENABLE_TASK_SERVICE: 1
      CODE_AGENT_ENABLE_POST_TERMINAL_QUALITY_EVALUATION_MODE: ${CODE_AGENT_ENABLE_POST_TERMINAL_QUALITY_EVALUATION_MODE:-0}
      CODE_AGENT_RETENTION_SECONDS: ${CODE_AGENT_RETENTION_SECONDS:-}
      CODE_AGENT_ALLOWED_LOCAL_REMOTES: ${CODE_AGENT_ALLOWED_LOCAL_REMOTES:-}
      CODE_AGENT_CONTEXT_ENVELOPE_ENABLED: ${CODE_AGENT_CONTEXT_ENVELOPE_ENABLED:-true}
      BUILD_SHA: ${BUILD_SHA:-}
      CODE_AGENT_ENV: ${CODE_AGENT_ENV:-local}
      CODE_AGENT_API_SHARED_SECRET: ${CODE_AGENT_API_SHARED_SECRET?Please set CODE_AGENT_API_SHARED_SECRET in .env}
      CODE_AGENT_TELEGRAM_BOT_TOKEN: ${CODE_AGENT_TELEGRAM_BOT_TOKEN:-}
      CODE_AGENT_READINESS_ALERT_TELEGRAM_CHAT_ID: ${CODE_AGENT_READINESS_ALERT_TELEGRAM_CHAT_ID:-}
      CODE_AGENT_TELEGRAM_WEBHOOK_SECRET_TOKEN: ${CODE_AGENT_TELEGRAM_WEBHOOK_SECRET_TOKEN:-}
      CODE_AGENT_TELEGRAM_WEBHOOK_ENABLED: ${CODE_AGENT_TELEGRAM_WEBHOOK_ENABLED:-0}
      CODE_AGENT_TELEGRAM_ALLOWED_USER_IDS: ${CODE_AGENT_TELEGRAM_ALLOWED_USER_IDS:-}
      CODE_AGENT_TELEGRAM_ALLOWED_CHAT_IDS: ${CODE_AGENT_TELEGRAM_ALLOWED_CHAT_IDS:-}
      CODE_AGENT_TELEGRAM_DEFAULT_REPO_KEY: ${CODE_AGENT_TELEGRAM_DEFAULT_REPO_KEY:-}
      CODE_AGENT_TELEGRAM_DEFAULT_REPO_URL: ${CODE_AGENT_TELEGRAM_DEFAULT_REPO_URL:-}
      CODE_AGENT_WEBHOOK_DEFAULT_REPO_URL: ${CODE_AGENT_WEBHOOK_DEFAULT_REPO_URL:-}
      CODE_AGENT_ALLOWED_REPOS: ${CODE_AGENT_ALLOWED_REPOS:-}
      CODE_AGENT_SCOUT_ALLOWED_REPOS: ${CODE_AGENT_SCOUT_ALLOWED_REPOS:-}
      CODE_AGENT_ALLOWED_ORIGINS: ${CODE_AGENT_ALLOWED_ORIGINS:-}
      CODE_AGENT_COOKIE_SECURE: ${CODE_AGENT_COOKIE_SECURE:-0}
      CODE_AGENT_ANTIGRAVITY_CLI_BIN: ${CODE_AGENT_ANTIGRAVITY_CLI_BIN:-agy}
      CODE_AGENT_ANTIGRAVITY_MODEL: ${CODE_AGENT_ANTIGRAVITY_MODEL:-gemini-3.8-flash}
      CODE_AGENT_ANTIGRAVITY_REASONING_EFFORT: ${CODE_AGENT_ANTIGRAVITY_REASONING_EFFORT:-medium}
      CODE_AGENT_ANTIGRAVITY_TIMEOUT_SECONDS: ${CODE_AGENT_ANTIGRAVITY_TIMEOUT_SECONDS:-120}
      CODE_AGENT_ANTIGRAVITY_NATIVE_SANDBOX_ENABLED: ${CODE_AGENT_ANTIGRAVITY_NATIVE_SANDBOX_ENABLED:-0}
      CODE_AGENT_ANTIGRAVITY_TOOL_PERMISSION: ${CODE_AGENT_ANTIGRAVITY_TOOL_PERMISSION:-proceed-in-sandbox}
      CODE_AGENT_ANTIGRAVITY_ARTIFACT_REVIEW_POLICY: ${CODE_AGENT_ANTIGRAVITY_ARTIFACT_REVIEW_POLICY:-agent-decides}
      CODE_AGENT_ENABLE_TRACING: ${CODE_AGENT_ENABLE_TRACING:-0}
      CODE_AGENT_TRACING_PROJECT: ${CODE_AGENT_TRACING_PROJECT:-code-agent-local}
      CODE_AGENT_TRACING_OTLP_ENDPOINT: ${CODE_AGENT_TRACING_OTLP_ENDPOINT:-http://phoenix:6006/v1/traces}
      PHOENIX_PROJECT_NAME: ${CODE_AGENT_TRACING_PROJECT:-code-agent-local}
      OTEL_RESOURCE_ATTRIBUTES: "openinference.project.name=${CODE_AGENT_TRACING_PROJECT:-code-agent-local},service.name=code-agent-api"
      DATABASE_HOST: ${DATABASE_HOST:-postgres}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB?Please set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER?Please set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?Please set POSTGRES_PASSWORD in .env}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${DATABASE_HOST:-postgres}:${DATABASE_PORT:-5432}/${POSTGRES_DB}
      TEMPORAL_ONLY_CUTOVER_AT: ${TEMPORAL_ONLY_CUTOVER_AT:-}
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS_DOCKER:-temporal:7233}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
  worker:
    logging: *bounded-logging
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      CODE_AGENT_RUN_API: 0
      CODE_AGENT_RUN_WORKER: 1
      CODE_AGENT_ENABLE_TASK_SERVICE: 1
      CODE_AGENT_ENABLE_POST_TERMINAL_QUALITY_EVALUATION_MODE: ${CODE_AGENT_ENABLE_POST_TERMINAL_QUALITY_EVALUATION_MODE:-0}
      CODE_AGENT_RETENTION_SECONDS: ${CODE_AGENT_RETENTION_SECONDS:-}
      CODE_AGENT_ALLOWED_LOCAL_REMOTES: ${CODE_AGENT_ALLOWED_LOCAL_REMOTES:-}
      CODE_AGENT_CONTEXT_ENVELOPE_ENABLED: ${CODE_AGENT_CONTEXT_ENVELOPE_ENABLED:-true}
      BUILD_SHA: ${BUILD_SHA:-}
      CODE_AGENT_ENV: ${CODE_AGENT_ENV:-local}
      CODE_AGENT_API_SHARED_SECRET: ${CODE_AGENT_API_SHARED_SECRET?Please set CODE_AGENT_API_SHARED_SECRET in .env}
      DATABASE_HOST: ${DATABASE_HOST:-postgres}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB?Please set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER?Please set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?Please set POSTGRES_PASSWORD in .env}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${DATABASE_HOST:-postgres}:${DATABASE_PORT:-5432}/${POSTGRES_DB}
      CODE_AGENT_TELEGRAM_BOT_TOKEN: ${CODE_AGENT_TELEGRAM_BOT_TOKEN:-}
      CODE_AGENT_TELEGRAM_DEFAULT_REPO_URL: ${CODE_AGENT_TELEGRAM_DEFAULT_REPO_URL:-}
      CODE_AGENT_ALLOWED_REPOS: ${CODE_AGENT_ALLOWED_REPOS:-}
      CODE_AGENT_SCOUT_ALLOWED_REPOS: ${CODE_AGENT_SCOUT_ALLOWED_REPOS:-}
      CODE_AGENT_CODEX_CLI_BIN: ${CODE_AGENT_CODEX_CLI_BIN:-codex}
      CODE_AGENT_CODEX_MODEL: ${CODE_AGENT_CODEX_MODEL:-gpt-6-luna}
      CODE_AGENT_CODEX_REASONING_EFFORT: ${CODE_AGENT_CODEX_REASONING_EFFORT:-high}
      CODE_AGENT_CODEX_SANDBOX: ${CODE_AGENT_CODEX_SANDBOX:-workspace-write}
      CODEX_HOME: /root/.codex
      CODE_AGENT_ANTIGRAVITY_CLI_BIN: ${CODE_AGENT_ANTIGRAVITY_CLI_BIN:-agy}
      CODE_AGENT_ANTIGRAVITY_MODEL: ${CODE_AGENT_ANTIGRAVITY_MODEL:-gemini-3.8-flash}
      CODE_AGENT_ANTIGRAVITY_REASONING_EFFORT: ${CODE_AGENT_ANTIGRAVITY_REASONING_EFFORT:-medium}
      CODE_AGENT_ANTIGRAVITY_TIMEOUT_SECONDS: ${CODE_AGENT_ANTIGRAVITY_TIMEOUT_SECONDS:-120}
      CODE_AGENT_ANTIGRAVITY_NATIVE_SANDBOX_ENABLED: ${CODE_AGENT_ANTIGRAVITY_NATIVE_SANDBOX_ENABLED:-0}
      CODE_AGENT_ANTIGRAVITY_TOOL_PERMISSION: ${CODE_AGENT_ANTIGRAVITY_TOOL_PERMISSION:-proceed-in-sandbox}
      CODE_AGENT_ANTIGRAVITY_ARTIFACT_REVIEW_POLICY: ${CODE_AGENT_ANTIGRAVITY_ARTIFACT_REVIEW_POLICY:-agent-decides}
      AGY_CLI_DISABLE_AUTO_UPDATE: ${AGY_CLI_DISABLE_AUTO_UPDATE:-true}
      CODE_AGENT_SANDBOX_IMAGE: ${CODE_AGENT_SANDBOX_IMAGE:-code-agent-worker}
      CODE_AGENT_QUEUE_MAX_ATTEMPTS: ${CODE_AGENT_QUEUE_MAX_ATTEMPTS:-3}
      CODE_AGENT_WORKSPACE_ROOT: ${CODE_AGENT_WORKSPACE_ROOT:-/tmp/code-agent-workspaces}
      CODE_AGENT_ENABLE_TRACING: ${CODE_AGENT_ENABLE_TRACING:-0}
      CODE_AGENT_TRACING_PROJECT: ${CODE_AGENT_TRACING_PROJECT:-code-agent-local}
      CODE_AGENT_TRACING_OTLP_ENDPOINT: ${CODE_AGENT_TRACING_OTLP_ENDPOINT:-http://phoenix:6006/v1/traces}
      PHOENIX_PROJECT_NAME: ${CODE_AGENT_TRACING_PROJECT:-code-agent-local}
      OTEL_RESOURCE_ATTRIBUTES: "openinference.project.name=${CODE_AGENT_TRACING_PROJECT:-code-agent-local},service.name=code-agent-worker"
      CODE_AGENT_CODEX_RUNTIME_MODE: ${CODE_AGENT_CODEX_RUNTIME_MODE:-native_agent}
      CODE_AGENT_NATIVE_EVENT_CAPTURE_ENABLED: ${CODE_AGENT_NATIVE_EVENT_CAPTURE_ENABLED:-${CODE_AGENT_NATIVE_AGENT_EVENT_CAPTURE_ENABLED:-0}}
      CODE_AGENT_CODEX_TRUSTED_REPO_PATTERNS: ${CODE_AGENT_CODEX_TRUSTED_REPO_PATTERNS:-}
      CODE_AGENT_DECOMPOSED_FANOUT_ENABLED: ${CODE_AGENT_DECOMPOSED_FANOUT_ENABLED:-false}
      CODE_AGENT_TEMPORAL_WORKER_ID: ${CODE_AGENT_TEMPORAL_WORKER_ID:-}
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS_DOCKER:-temporal:7233}
      GH_TOKEN: ${GH_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
    restart: on-failure
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - type: bind
        source: ${CODE_AGENT_CODEX_AUTH_DIR?Please set CODE_AGENT_CODEX_AUTH_DIR in env}/auth.json
        target: /root/.codex/auth.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CODE_AGENT_ANTIGRAVITY_AUTH_DIR?Please set CODE_AGENT_ANTIGRAVITY_AUTH_DIR in env}/antigravity-cli/antigravity-oauth-token
        target: /root/.gemini/antigravity-cli/antigravity-oauth-token
        read_only: true
        bind:
          create_host_path: false
      - ${CODE_AGENT_WORKSPACE_ROOT:-/tmp/code-agent-workspaces}:${CODE_AGENT_WORKSPACE_ROOT:-/tmp/code-agent-workspaces}
  phoenix:
    logging: *bounded-logging
    image: arizephoenix/phoenix:latest
    ports:
      - "127.0.0.1:6006:6006"
      - "127.0.0.1:4317:4317"
    profiles:
      - observability
  dashboard:
    logging: *bounded-logging
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      target: dev
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./dashboard:/app
      - /app/node_modules
    depends_on:
      api:
        condition: service_healthy
    environment:
      VITE_API_URL: http://api:8000
  telegram-ingress:
    image: nginx:stable-alpine@sha256:47928bf67eb62a1863cb08d9ecb52d3e704304ba614eaee17884204677702951
    logging: *bounded-logging
    user: "101:101"
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    pids_limit: 64
    mem_limit: 64m
    cpus: 0.25
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,uid=101,gid=101
    volumes:
      - ./deploy/telegram/nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [telegram-upstream, telegram-edge]
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      api:
        condition: service_healthy
    profiles: [tunnel]
  ngrok:
    logging: *bounded-logging
    image: ngrok/ngrok:latest
    restart: unless-stopped
    # Exposes only the route restricted telegram-ingress service over HTTPS.

    # Requires NGROK_AUTHTOKEN in .env (free at dashboard.ngrok.com → Your Authtoken).
    # Set NGROK_DOMAIN for a stable URL that never changes (free static domain
    # from dashboard.ngrok.com → Domains → New Domain).
    #
    # Query the current URL at any time:
    #   curl -s http://localhost:4040/api/tunnels
    #
    # Start: docker compose --profile tunnel up -d
    command: >
      http telegram-ingress:8080 --inspect=false ${NGROK_DOMAIN:+--url=${NGROK_DOMAIN}}

    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN?Please set NGROK_AUTHTOKEN in .env}
      NGROK_DOMAIN: ${NGROK_DOMAIN:-}
    ports:
      - "127.0.0.1:4040:4040"
    networks: [telegram-edge]
    depends_on:
      telegram-ingress:
        condition: service_healthy
    profiles:
      - tunnel
  init-webhook:
    logging: *bounded-logging
    image: alpine:latest
    restart: "no"
    depends_on:
      api:
        condition: service_healthy
      ngrok:
        condition: service_started
    profiles:
      - tunnel
    environment:
      CODE_AGENT_TELEGRAM_BOT_TOKEN: ${CODE_AGENT_TELEGRAM_BOT_TOKEN:-}
      CODE_AGENT_TELEGRAM_WEBHOOK_SECRET_TOKEN: ${CODE_AGENT_TELEGRAM_WEBHOOK_SECRET_TOKEN:-}
      CODE_AGENT_TELEGRAM_WEBHOOK_ENABLED: ${CODE_AGENT_TELEGRAM_WEBHOOK_ENABLED:-0}
      CODE_AGENT_TELEGRAM_ALLOWED_USER_IDS: ${CODE_AGENT_TELEGRAM_ALLOWED_USER_IDS:-}
      CODE_AGENT_TELEGRAM_ALLOWED_CHAT_IDS: ${CODE_AGENT_TELEGRAM_ALLOWED_CHAT_IDS:-}
    networks: [telegram-edge]
    volumes:
      - ./scripts/init_webhook.sh:/init_webhook.sh:ro
    command: ["sh", "/init_webhook.sh"]
volumes:
  postgres_data:
networks:
  default: {}
  telegram-edge: {}
  telegram-upstream:
    internal: true
