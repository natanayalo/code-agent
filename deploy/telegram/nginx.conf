pid /tmp/nginx.pid;
error_log /dev/stderr warn;
worker_processes 1;
events { worker_connections 128; }
http {
    # Do not retain message bodies, query strings, authentication headers or IPs.
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 256k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 15s;
    server {
        listen 8080;
        location = /telegram/webhook {
            # location matching normalizes paths; inspect the original URI too.
            if ($request_uri != /telegram/webhook) { return 404; }
            if ($request_method != POST) { return 405; }
            proxy_pass http://api:8000;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_set_header Host api;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header Forwarded "";
        }
        location / { return 404; }
    }
}
